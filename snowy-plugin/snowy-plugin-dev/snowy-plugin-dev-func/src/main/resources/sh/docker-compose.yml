version: '3'

services:
  web:
    container_name: ${system.container.name}  # 替换成你希望的容器名称
    image: epc:latest
    ports:
      - "${SYSTEM_PORT}:80"
    volumes:
      - ./nginx_logs:/var/log/nginx  # 挂载nginx日志到宿主机
      - ./redis_data:/var/lib/redis  # 挂载redis数据到宿主机
      - ./redis_logs:/var/log/redis  # 挂载redis日志到宿主机
      - ./app_logs:/app/logs  # 挂载应用日志到宿主机lo
