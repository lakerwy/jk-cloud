# Redis 配置文件
# 绑定的IP地址，默认是本地回环地址
bind 127.0.0.1

# 监听的端口
port 6379

# 启用后台运行
daemonize yes

# 日志文件路径
logfile /var/log/redis/redis-server.log

# 数据库文件保存路径
dir /var/lib/redis

# 设置密码，如果不需要密码访问，可以注释掉或设置为空
requirepass 123456

# 允许在后台进行持久化操作
save 900 1
save 300 10
save 60 10000

# 关闭保护模式，允许外部访问
protected-mode no

# 允许执行任意命令
rename-command CONFIG ""

# 设置内存使用的最大阈值
maxmemory 2GB
maxmemory-policy allkeys-lru

# 客户端最大空闲时间，超过这个时间连接将被关闭
timeout 0

# 关闭AOF（Append Only File）持久化模式
appendonly no