server:
  port: 82
  servlet:
    context-path: /api

spring:
  profiles:
    active: local
  servlet:
    multipart:
      max-request-size: 100MB
      max-file-size: 100MB

  rabbitmq:
    host: 10.0.33.81 #rabbitmq 地址
    port: 5672
    username: guest
    password: guest
  cloud:
    function:
      definition: sink;delayedMessage #函数名称，对应服务中的注入的Bean  transfer 非必须
    #      definition: source;sink;transfer #函数名称，对应服务中的注入的Bean
    stream:
      bindings:        #服务的整合处理
        jkYunOutPut-test:    #这个是消息通道的名称 --->保存消息到输出通道
          destination: ${rabbit.topic.exchange}     #exchange名称,交换模式默认是topic;把SpringCloud stream的消息输出通道绑定到RabbitMQ的exchange-saveOrder交换器。
          content-type: application/json      #设置消息的类型，本次为json
          default-binder: defaultRabbit
          group: ${spring.application.name}               #分组
        sink-in-0: #这个是消息通道的名称 --->保存消息到输入通道
          destination: ${rabbit.topic.exchange}      #exchange名称,交换模式默认是topic;把SpringCloud stream的消息输出通道绑定到RabbitMQ的exchange-saveOrder交换器。
          content-type: application/json      #设置消息的类型，本次为json
          default-binder: defaultRabbit
          group: ${spring.application.name}              #分组
        delayedMessage-out-1: #  延迟队列 生产者
          destination: ${rabbit.delayed.exchange}     #exchange名称,交换模式默认是topic;把SpringCloud stream的消息输出通道绑定到RabbitMQ的exchange-saveOrder交换器。
          content-type: application/json      #设置消息的类型，本次为json
          default-binder: defaultRabbit
          group: ${spring.application.name}               #分组
        delayedMessage-in-1: #  延迟队列 消费者
          destination: ${rabbit.delayed.exchange}     #exchange名称,交换模式默认是topic;把SpringCloud stream的消息输出通道绑定到RabbitMQ的exchange-saveOrder交换器。
          content-type: application/json      #设置消息的类型，本次为json
          default-binder: defaultRabbit
          group: ${spring.application.name}               #分组
      rabbit:
        bindings:
          delayedMessage-in-1:
            consumer:
              delayedExchange: true  # 开启延迟功能
          delayedMessage-out-1:
            producer:
              delayedExchange: true  # 开启延迟功能

  datasource:
    dynamic:
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${mysql.host}:${mysql.port}/${mysql.database}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&useInformationSchema=true
          username: ${mysql.username}
          password: ${mysql.password}
      strict: true
      # druid global configuration
      public-key: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAMWiTVtdXFVrgFHDDKELZM0SywkWY3KjugN90eY5Sogon1j8Y0ClPF7nx3FuE7pAeBKiv7ChIS0vvx/59WUpKmUCAwEAAQ==
      druid:
        initial-size: 5
        max-active: 20
        min-idle: 5
        max-wait: 60000
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        validation-query-timeout: 2000
        test-on-borrow: false
        test-on-return: false
        test-while-idle: true
        time-between-eviction-runs-millis: 6000
        min-evictable-idle-time-millis: 300000
        filters: stat
        break-after-acquire-failure: false
    # druid monitor configuration
    druid:
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: 123456

  #########################################
  # jackson configuration
  #########################################
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    locale: zh_CN

  #########################################
  # redis configuration
  #########################################
  redis:
    database: 1
    host: 127.0.0.1
    port: 6379
    password: 123456
    timeout: 10s
    lettuce:
      pool:
        max-active: 200
        max-wait: -1ms
        max-idle: 10
        min-idle: 0

#########################################
# mybatis-plus configuration
#########################################
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    jdbc-type-for-null: 'null'
  global-config:
    banner: false
    enable-sql-runner: true
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: DELETE_FLAG
      logic-delete-value: DELETED
      logic-not-delete-value: NOT_DELETE
  mapper-locations: classpath*:vip/xiaonuo/**/mapping/*.xml
  type-handlers-package: vip.xiaonuo.common.handler

#########################################
# easy-trans configuration
#########################################
easy-trans:
  is-enable-redis: true
  is-enable-global: true
  is-enable-tile: true

#########################################
# sa-token configuration
#########################################
sa-token:
  token-name: token
  timeout: 86400
  activity-timeout: -1
  is-concurrent: true
  is-share: false
  max-login-count: -1
  token-style: random-32
  is-log: false
  is-print: false

  # sa-token alone-redis configuration
  alone-redis:
    database: 2
    host: ${spring.redis.host}
    port: ${spring.redis.port}
    password: ${spring.redis.password}
    timeout: ${spring.redis.timeout}
    lettuce:
      pool:
        max-active: ${spring.redis.lettuce.pool.max-active}
        max-wait: ${spring.redis.lettuce.pool.max-wait}
        max-idle: ${spring.redis.lettuce.pool.max-idle}
        min-idle: ${spring.redis.lettuce.pool.min-idle}

#########################################
# knife4j configuration
#########################################
knife4j:
  enable: true
  production: false
  basic:
    enable: false
    username: admin
    password: 123456
  setting:
    enableOpenApi: false
    enableSwaggerModels: false
    enableFooter: false
    enableFooterCustom: true
    footerCustomContent: Apache License 2.0 | Copyright 2022-[SNOWY](https://www.xiaonuo.vip)

#########################################
# camunda configuration
#########################################
camunda:
  bpm:
    database:
      schema-update: true
    auto-deployment-enabled: false
    job-execution:
      enabled: false
    eventing:
      history: false
    metrics:
      enabled: false

# common configuration
snowy:
  config:
    common:
      front-url: ${snowy.front.url}
      backend-url: ${snowy.backend.url}

    # plugin ten configuration
    ten:
      enabled: false
      ignore-table-names:
      ten-id-column-name: TENANT_ID
      default-ten-id: -1

