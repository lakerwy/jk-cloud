version: "3"
services:
  web:
    #定义主机名
    container_name: test-Nginx
    #使用的镜像
    image: nginx:1.22.1
    #容器的映射端口
    ports:
      - 9780:80
    #定义挂载点
    volumes:
      - $pwd/html:/usr/share/nginx/html
      - $pwd/conf/nginx.conf:/etc/nginx/nginx.conf
      - $pwd/conf.d:/etc/nginx/conf.d
      - $pwd/logs:/var/log/nginx
    #docker 重启后，容器自启动
    restart: always