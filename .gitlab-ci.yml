image: mykjack/jkmaven:latest

stages:
  - build
  - deploy_biz
  # Uncomment the following lines if you have deploy stages for other modules
  # - deploy_flw
  # - deploy_web

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=/root/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  REMOTE_SERVER: "10.0.33.82"
  REMOTE_USERNAME: "root"
  REMOTE_PATH: "/home/jkMicroService/jkCloud"

cache:
  paths:
    - /root/.m2/repository

before_script:
  # - apt-get update
  # - apt-get install -y openssh-client
  - eval $(ssh-agent -s)
  - export SSH_PRIVATE_KEY_NO_CR=$(echo "$SSH_PRIVATE_KEY" | tr -d '\r')
  - echo "$SSH_PRIVATE_KEY_NO_CR" | ssh-add -
  - mkdir -p ~/.ssh
  - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa
#  - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$REMOTE_SERVER "touch /home/jkMicroService/jkCloud/test_file.txt"

build:
  stage: build
  only:
    - dev20230619
  script:
    - cp $CI_PROJECT_DIR/settings.xml /root/.m2/settings.xml
    - "mvn ${MAVEN_OPTS} ${MAVEN_CLI_OPTS} clean package -DskipTests"
  artifacts:
    paths:
      - $CI_PROJECT_DIR/snowy-modules/snowy-biz-app/target/snowy-*-app.jar
    expire_in: 1 day
  tags:
    - server

deploy_biz:
  stage: deploy_biz
  only:
    - dev20230619
  script:
    - cd snowy-modules/snowy-biz-app/target/
    - ls -la  # List the current directory structure to see the build artifacts
    - echo $SSH_PRIVATE_KEY_NO_CR
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$REMOTE_SERVER "touch /home/jkMicroService/jkCloud/test_file.txt"
    # - scp -o StrictHostKeyChecking=no -i /dev/stdin -v snowy-biz-app.jar $REMOTE_USERNAME@$REMOTE_SERVER:$REMOTE_PATH/biz/
    - rsync -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" -av snowy-biz-app.jar $REMOTE_USERNAME@$REMOTE_SERVER:$REMOTE_PATH/biz/
  #  - echo "$SSH_PRIVATE_KEY_NO_CR" | ssh -o StrictHostKeyChecking=no -i /dev/stdin $REMOTE_USERNAME@$REMOTE_SERVER "cd $REMOTE_PATH/biz/ && ./restart.sh"
  dependencies:
    - build
  tags:
    - server
