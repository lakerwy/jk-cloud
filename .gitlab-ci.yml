image: maven:3.6.3-openjdk-8

stages:
  - build
#  - deploy
  # Uncomment the following lines if you have deploy stages for other modules
  # - deploy_flw
  # - deploy_web

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=/root/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  REMOTE_SERVER: "10.0.33.82"
  REMOTE_USERNAME: "root"
  REMOTE_PATH: "/home/jkMicroService/jkCloud"

cache:
  paths:
    - /root/.m2/repository

before_script:
#  - apt-get update
#  - apt-get install -y openssh-client rsync
  - eval $(ssh-agent -s)
  - export SSH_PRIVATE_KEY_NO_CR=$(echo "$SSH_PRIVATE_KEY" | tr -d '\r')
  - echo "$SSH_PRIVATE_KEY_NO_CR" | ssh-add -
  - mkdir -p ~/.ssh
  - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa
#  - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$REMOTE_SERVER "touch /home/jkMicroService/jkCloud/test_file.txt"

build:
  stage: build
  only:
    - dev20230619
  script:
    - cp $CI_PROJECT_DIR/settings.xml /root/.m2/settings.xml
    - "mvn ${MAVEN_OPTS} ${MAVEN_CLI_OPTS} clean package -DskipTests"
#  artifacts:                不上传产物到gitlab 服务器
#    paths:
#      - $CI_PROJECT_DIR/snowy-modules/snowy-biz-app/target/snowy-*-app.jar
#      - $CI_PROJECT_DIR/snowy-modules/snowy-flw-app/target/snowy-*-app.jar
#      - $CI_PROJECT_DIR/snowy-modules/snowy-web-app/target/snowy-*-app.jar
#    expire_in: 1 day
    # Instead of using artifacts, directly upload the JAR files to the remote server
  after_script:
    - echo "-------start bizApp--------"
    - rsync -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" -av $CI_PROJECT_DIR/snowy-modules/snowy-biz-app/target/snowy-*-app.jar $REMOTE_USERNAME@$REMOTE_SERVER:$REMOTE_PATH/biz/
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$REMOTE_SERVER "cd $REMOTE_PATH/biz/ && ./restart.sh"
    - echo "-------end bizApp--------"

    - echo "-------start flwApp--------"
    - rsync -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" -av $CI_PROJECT_DIR/snowy-modules/snowy-flw-app/target/snowy-*-app.jar $REMOTE_USERNAME@$REMOTE_SERVER:$REMOTE_PATH/flw/
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$REMOTE_SERVER "cd $REMOTE_PATH/flw/ && ./restart.sh"
    - echo "-------end flwApp--------"

    - echo "-------start procureApp--------"
    - rsync -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" -av $CI_PROJECT_DIR/snowy-modules/snowy-procure-app/target/snowy-*-app.jar $REMOTE_USERNAME@$REMOTE_SERVER:$REMOTE_PATH/procure/
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$REMOTE_SERVER "cd $REMOTE_PATH/procure/ && ./restart.sh"
    - echo "-------end procureApp--------"

    - echo "-------start webApp--------"
    - rsync -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" -av $CI_PROJECT_DIR/snowy-modules/snowy-web-app/target/snowy-*-app.jar $REMOTE_USERNAME@$REMOTE_SERVER:$REMOTE_PATH/web/
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$REMOTE_SERVER "cd $REMOTE_PATH/web/ && ./restart.sh"
    - echo "-------end webApp--------"
  tags:
    - server2


