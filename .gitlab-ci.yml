image: maven:3.6.3-jdk-8

stages:
  - build

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=/cache/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

cache:
  paths:
    - /cache

before_script:
  - cp $CI_PROJECT_DIR/settings.xml /usr/share/maven/conf/settings.xml
  - mvn ${MAVEN_CLI_OPTS} clean

build:
  stage: build
  only:
    - dev20230619
  script:
    - "mvn ${MAVEN_CLI_OPTS} clean package -DskipTests"
  artifacts:
    paths:
      - $CI_PROJECT_DIR/snowy-modules/snowy-biz-app/target/snowy-*-app.jar
#      - $CI_PROJECT_DIR/snowy-modules/snowy-web-app/target/snowy-*-app.jar
#      - $CI_PROJECT_DIR/snowy-modules/snowy-flw-app/target/snowy-*-app.jar
#      - $CI_PROJECT_DIR/snowy-server/snowy-gateway-app/target/snowy-*-app.jar
      # Add more paths for other modules as needed
    expire_in: 1 week
  tags:
    - jk
