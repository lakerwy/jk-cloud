image: maven:3.6.3-jdk-8

stages:
  - build
  - deploy_biz
  # Uncomment the following lines if you have deploy stages for other modules
  # - deploy_flw
  # - deploy_web

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=/home/runner/maven/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  REMOTE_SERVER: "10.0.33.82"
  REMOTE_USERNAME: "root"
  REMOTE_PATH: "/home/jkMicroService/jkCloud"
  EXTERNAL_SETTINGS: "/home/runner/maven/settings.xml"  # Specify the path to your external settings.xml file

cache:
  paths:
    - /home/runner/cache

before_script:
  - eval $(ssh-agent -s)
  - export SSH_PRIVATE_KEY_NO_CR=$(echo "$SSH_PRIVATE_KEY" | tr -d '\r')
  - echo "$SSH_PRIVATE_KEY_NO_CR" | ssh-add -

build:
  stage: build
  only:
    - dev20230619
  script:
    - "mvn ${MAVEN_CLI_OPTS} clean package -DskipTests --settings $EXTERNAL_SETTINGS"
  artifacts:
    paths:
      - $CI_PROJECT_DIR/snowy-modules/snowy-biz-app/target/snowy-*-app.jar
    expire_in: 1 week
  tags:
    - server

deploy_biz:
  stage: deploy_biz
  script:
    - cd snowy-modules
    - ls -la  # List the current directory structure to see the build artifacts
    - echo "$SSH_PRIVATE_KEY_NO_CR" | scp -o StrictHostKeyChecking=no -i /dev/stdin $CI_PROJECT_DIR/snowy-modules/snowy-biz-app/target/snowy-*-app.jar $REMOTE_USERNAME@$REMOTE_SERVER:$REMOTE_PATH/biz/
    - echo "$SSH_PRIVATE_KEY_NO_CR" | ssh -o StrictHostKeyChecking=no -i /dev/stdin $REMOTE_USERNAME@$REMOTE_SERVER "cd $REMOTE_PATH/biz/ && ./restart.sh"
  only:
    - dev20230619
  tags:
    - server
