image: mykjack/jkmaven:latest

stages:
  - test
  - pro
  # Uncomment the following lines if you have deploy stages for other modules
  # - deploy_flw
  # - deploy_web

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=/root/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  REMOTE_SERVER: "10.0.33.81"
  REMOTE_USERNAME: "root"
  REMOTE_PATH: "/home/jkTest/"
  PRO_SERVER: "10.0.33.81"
  PRO_PATH: "/home/jkTest/"

cache:
  paths:
    - /root/.m2/repository

before_script:
  # 清除 apt 缓存
  #- apt-get clean
  # 设置阿里云的 Debian 源
  #- echo "deb http://mirrors.aliyun.com/debian/ bookworm main contrib non-free" > /etc/apt/sources.list
  #- echo "deb http://mirrors.aliyun.com/debian/ bookworm-updates main contrib non-free" >> /etc/apt/sources.list
  #- echo "deb http://mirrors.aliyun.com/debian-security bookworm-security main contrib non-free" >> /etc/apt/sources.list
  # 确认新源已正确添加
  #- cat /etc/apt/sources.list

  #- apt-get update && apt-get install -y --no-install-recommends openssh-client rsync
  
  - eval $(ssh-agent -s)
  - export SSH_PRIVATE_KEY_NO_CR=$(echo "$SSH_PRIVATE_KEY" | tr -d '\r')
  - echo "$SSH_PRIVATE_KEY_NO_CR" | ssh-add -
  - mkdir -p ~/.ssh
  - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa
#  - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$REMOTE_SERVER "touch /home/jkMicroService/jkCloud/test_file.txt"

deploy_test:
  stage: test
  only:
    - dev20230619
  script:
    - cp $CI_PROJECT_DIR/settings.xml /root/.m2/settings.xml
    - "mvn ${MAVEN_OPTS} ${MAVEN_CLI_OPTS} clean package -DskipTests -T 1C"
#  artifacts:                不上传产物到gitlab 服务器
#    paths:
#      - $CI_PROJECT_DIR/snowy-modules/snowy-biz-app/target/snowy-*-app.jar
#      - $CI_PROJECT_DIR/snowy-modules/snowy-flw-app/target/snowy-*-app.jar
#      - $CI_PROJECT_DIR/snowy-modules/snowy-web-app/target/snowy-*-app.jar
#    expire_in: 1 day
    # Instead of using artifacts, directly upload the JAR files to the remote server
  after_script:
    - echo "-------start bizApp--------"
    - rsync -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" -av $CI_PROJECT_DIR/snowy-modules/snowy-biz-app/target/snowy-*-app.jar $REMOTE_USERNAME@$REMOTE_SERVER:$REMOTE_PATH/biz/
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$REMOTE_SERVER "cd $REMOTE_PATH/biz/ && ./restart.sh"
    - echo "-------end bizApp--------"

    - echo "-------start flwApp--------"
    - rsync -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" -av $CI_PROJECT_DIR/snowy-modules/snowy-flw-app/target/snowy-*-app.jar $REMOTE_USERNAME@$REMOTE_SERVER:$REMOTE_PATH/flw/
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$REMOTE_SERVER "cd $REMOTE_PATH/flw/ && ./mange.sh restart"
    - echo "-------end flwApp--------"

    - echo "-------start procureApp--------"
    - rsync -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" -av $CI_PROJECT_DIR/snowy-modules/snowy-procure-app/target/snowy-*-app.jar $REMOTE_USERNAME@$REMOTE_SERVER:$REMOTE_PATH/procure/
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$REMOTE_SERVER "cd $REMOTE_PATH/procure/ && ./mange.sh restart"
    - echo "-------end procureApp--------"

    - echo "-------start webApp--------"
    - rsync -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" -av $CI_PROJECT_DIR/snowy-modules/snowy-web-app/target/snowy-*-app.jar $REMOTE_USERNAME@$REMOTE_SERVER:$REMOTE_PATH/web/
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$REMOTE_SERVER "cd $REMOTE_PATH/web/ && ./mange.sh restart"
    - echo "-------end webApp--------"
  tags:
    - server

deploy_pro:
  stage: pro
  when: manual
  only:
    - dev20230619
  script:
    - cp $CI_PROJECT_DIR/settings.xml /root/.m2/settings.xml
    - "mvn ${MAVEN_OPTS} ${MAVEN_CLI_OPTS} clean package -DskipTests -T 1C"
#  artifacts:                不上传产物到gitlab 服务器
#    paths:
#      - $CI_PROJECT_DIR/snowy-modules/snowy-biz-app/target/snowy-*-app.jar
#      - $CI_PROJECT_DIR/snowy-modules/snowy-flw-app/target/snowy-*-app.jar
#      - $CI_PROJECT_DIR/snowy-modules/snowy-web-app/target/snowy-*-app.jar
#    expire_in: 1 day
    # Instead of using artifacts, directly upload the JAR files to the remote server
  after_script:
    - echo "-------start bizApp--------"
    - rsync -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" -av $CI_PROJECT_DIR/snowy-modules/snowy-biz-app/target/snowy-*-app.jar $REMOTE_USERNAME@$PRO_SERVER:$PRO_PATH/biz/
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$PRO_SERVER "cd $PRO_PATH/biz/ && ./restart.sh"
    - echo "-------end bizApp--------"

    - echo "-------start flwApp--------"
    - rsync -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" -av $CI_PROJECT_DIR/snowy-modules/snowy-flw-app/target/snowy-*-app.jar $REMOTE_USERNAME@$PRO_SERVER:$PRO_PATH/flw/
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$PRO_SERVER "cd $PRO_PATH/flw/ && ./mange.sh restart"
    - echo "-------end flwApp--------"

    - echo "-------start procureApp--------"
    - rsync -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" -av $CI_PROJECT_DIR/snowy-modules/snowy-procure-app/target/snowy-*-app.jar $REMOTE_USERNAME@$PRO_SERVER:$PRO_PATH/procure/
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$PRO_SERVER "cd $PRO_PATH/procure/ && ./mange.sh restart"
    - echo "-------end procureApp--------"

    - echo "-------start webApp--------"
    - rsync -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" -av $CI_PROJECT_DIR/snowy-modules/snowy-web-app/target/snowy-*-app.jar $REMOTE_USERNAME@$PRO_SERVER:$PRO_PATH/web/
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $REMOTE_USERNAME@$PRO_SERVER "cd $PRO_PATH/web/ && ./mange.sh restart"
    - echo "-------end webApp--------"
  tags:
    - server