version: '3.7'
services:
  epcNginx:
    container_name: epcNginx
    restart: on-failure
    image: "nginx:latest"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "9657:80"
    volumes:
      - ./html:/usr/share/nginx/html
      - ./conf/nginx.conf:/etc/nginx/nginx.conf
      - ./conf.d:/etc/nginx/conf.d
      - ./logs:/var/log/nginx
    privileged: true
    networks:
      - epcCloud

networks:
  epcCloud:
    driver: bridge




