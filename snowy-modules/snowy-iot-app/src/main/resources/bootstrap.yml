spring:
  application:
    name: snowy-iot-app
  profiles:
    active: test
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: snowy-cloud-2x-ent-${spring.profiles.active}
        group: ${spring.profiles.active}
        prefix: ${spring.application.name}
        file-extension: yaml
        username: nacos
        password: nacos
  config:
    import:
      - "classpath:iot.yml"