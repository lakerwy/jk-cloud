version: "3"
services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9800:9000"                                        # api端口
      - "42512:42512"                                      # 控制台端口
    volumes:                                               # 主机路径映射容器
      - "./data/data1:/data1"
      - "./data/data2:/data2"
      - "./config:/root/.minio"
    command: server --console-address ":42512" http://minio/data{1...2}
    environment:                                           # 设置环境变量,相当于docker run命令中的-e
      MINIO_ROOT_USER: "admin"                        # 登录账号
      MINIO_ROOT_PASSWORD: "Jianke66"                    # 登录密码
      TZ: Asia/Shanghai
      LANG: en_US.UTF-8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3