version: '3.7'
services:
  epcNacos:
    container_name: epcNacos
    restart: on-failure
    build: ./nacos
    image: "epcnacos"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
    networks:
      - epcCloud

  epcActuator:
    container_name: epcActuator
    restart: on-failure
    build: ./actuator
    image: "epcactuator"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "9009:9009"
    networks:
      - epcCloud

  epcGateway:
    container_name: epcGateway
    restart: on-failure
    build: ./gateway
    image: "epcgateway"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "9003:9003"
    networks:
      - epcCloud

  epcSentinel:
    container_name: epcSentinel
    restart: on-failure
    build: ./sentinel
    image: "epcsentinel"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "9007:9007"
    networks:
      - epcCloud

  epcXXJob:
    container_name: epcXXJob
    restart: on-failure
    build: ./job
    image: "epcxxjob"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "9008:9008"
    networks:
      - epcCloud

  epcTen:
    container_name: epcTen
    restart: on-failure
    build: ./ten
    image: "epcten"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "9004:9004"
    networks:
      - epcCloud

  epcFlw:
    container_name: epcFlw
    restart: on-failure
    build: ./flw
    image: "epcflw"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "9005:9005"
    networks:
      - epcCloud

  epcUrp:
    container_name: epcUrp
    restart: on-failure
    build: ./urp
    image: "epcurp"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "9006:9006"
    networks:
      - epcCloud

  epcWeb:
    container_name: epcWeb
    restart: on-failure
    build: ./web
    image: "epcweb"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "9001:9001"
    networks:
      - epcCloud

  epcBiz:
    container_name: epcBiz
    restart: on-failure
    build: ./biz
    image: "epcbiz"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "9002:9002"
    networks:
      - epcCloud

networks:
  epcCloud:
    driver: bridge




